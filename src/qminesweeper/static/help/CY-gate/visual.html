<div class="gate-visual">
  <svg viewBox="0 0 260 104" role="img" style="width:100%;max-width:320px;height:auto"
       aria-label="Circuit diagram: a control cell connected to a target cell marked with a Y gate box">
    <g fill="currentColor" font-size="12">
      <text x="4" y="36">control</text>
      <text x="4" y="76">target</text>
    </g>
    <g stroke="currentColor" stroke-width="1.5" fill="none">
      <line x1="60" y1="32" x2="244" y2="32"/>
      <!-- The target wire stops at the gate box and resumes after it. -->
      <line x1="60" y1="72" x2="139" y2="72"/>
      <line x1="171" y1="72" x2="244" y2="72"/>
      <line x1="155" y1="32" x2="155" y2="56"/>
      <rect x="139" y="56" width="32" height="32" rx="3"/>
    </g>
    <circle cx="155" cy="32" r="5" fill="currentColor"/>
    <text x="155" y="78" text-anchor="middle" font-size="17" fill="currentColor">Y</text>
  </svg>
  <p>If the control cell holds a mine, a Y gate is applied to the target.</p>
</div>
