<svg viewBox="0 0 320 190" role="img" aria-labelledby="reveal-visual-title reveal-visual-desc">
  <title id="reveal-visual-title">What Reveal shows</title>
  <desc id="reveal-visual-desc">
    Four translucent board cells use red fill to show mine probability. Two
    half-filled symbols are connected and outlined in blue to mark entanglement.
  </desc>

  <defs>
    <linearGradient id="reveal-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.10" />
      <stop offset="0.48" stop-color="currentColor" stop-opacity="0.025" />
      <stop offset="1" stop-color="currentColor" stop-opacity="0.07" />
    </linearGradient>
    <filter id="reveal-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="178" rx="16"
        fill="currentColor" opacity="0.035" />
  <text x="160" y="30" fill="currentColor" font-family="system-ui, sans-serif"
        font-size="15" font-weight="650" text-anchor="middle">What Reveal shows</text>

  <!-- Safe: the probability meter is empty. -->
  <g transform="translate(18 58)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect width="56" height="56" rx="10" fill="var(--btn-bg)"
          stroke="currentColor" stroke-opacity="0.16" />
    <rect x="1" y="1" width="54" height="54" rx="9" fill="url(#reveal-glass)" />
    <text x="28" y="75" fill="currentColor" font-size="11" opacity="0.68">safe</text>
  </g>

  <!-- Certain mine: the probability meter fills the tile. -->
  <g transform="translate(90 58)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect width="56" height="56" rx="10" fill="var(--btn-bg)"
          stroke="currentColor" stroke-opacity="0.16" />
    <rect x="1" y="1" width="54" height="54" rx="9" fill="var(--boom)" opacity="0.22" />
    <rect x="1" y="1" width="54" height="54" rx="9" fill="url(#reveal-glass)" />
    <text x="28" y="75" fill="currentColor" font-size="11" opacity="0.68">mine</text>
  </g>

  <!-- Entangled cells: half-height mine fill, with one restrained blue outline. -->
  <g transform="translate(174 58)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="-3" y="-3" width="62" height="62" rx="13" fill="none"
          stroke="var(--accent)" stroke-width="2" opacity="0.78" />
    <rect width="56" height="56" rx="10" fill="var(--btn-bg)" />
    <path d="M1 28 H55 V46 Q55 55 46 55 H10 Q1 55 1 46 Z"
          fill="var(--boom)" opacity="0.22" />
    <rect x="1" y="1" width="54" height="54" rx="9" fill="url(#reveal-glass)" />
    <text x="28" y="35" fill="var(--boom)" font-size="18" font-weight="650">◐</text>
  </g>
  <g transform="translate(246 58)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="-3" y="-3" width="62" height="62" rx="13" fill="none"
          stroke="var(--accent)" stroke-width="2" opacity="0.78" />
    <rect width="56" height="56" rx="10" fill="var(--btn-bg)" />
    <path d="M1 28 H55 V46 Q55 55 46 55 H10 Q1 55 1 46 Z"
          fill="var(--boom)" opacity="0.22" />
    <rect x="1" y="1" width="54" height="54" rx="9" fill="url(#reveal-glass)" />
    <text x="28" y="35" fill="var(--boom)" font-size="18" font-weight="650">◐</text>
  </g>

  <!-- Draw the entanglement last so it stays above every tile and fill. -->
  <path d="M224 61 C230 42 246 42 252 61" fill="none"
        stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
        opacity="0.16" filter="url(#reveal-soft-glow)" />
  <path d="M224 61 C230 42 246 42 252 61" fill="none"
        stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"
        opacity="0.95" />
  <text x="238" y="133" fill="var(--accent)" font-family="system-ui, sans-serif"
        font-size="11" font-weight="650" text-anchor="middle">entangled</text>

  <!-- A compact legend keeps the illustration understandable without prose. -->
  <g transform="translate(72 158)" font-family="system-ui, sans-serif" font-size="10.5">
    <rect x="0" y="-8" width="18" height="8" rx="3" fill="var(--boom)" opacity="0.28" />
    <text x="25" y="0" fill="currentColor" opacity="0.72">mine chance</text>
    <line x1="112" y1="-4" x2="132" y2="-4" stroke="var(--accent)"
          stroke-width="2" stroke-linecap="round" />
    <text x="140" y="0" fill="currentColor" opacity="0.72">entangled</text>
  </g>
</svg>
