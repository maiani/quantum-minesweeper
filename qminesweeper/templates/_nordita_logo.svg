{#
  Nordita logo, single-colour and inlined so it can follow the page theme:
  every shape uses `currentColor`, so CSS sets the colour (see .footer-logo--nordita
  in base.css). An <img> could not do that — a referenced SVG cannot see page CSS.

  Rebuilt from the pieces we own rather than tracing the small raster logo:
    - mark:     the petal paths of static/nordita.svg (the official vector logo).
                That file paints a white lens over the middle of the petals; the
                current logo leaves the middle open, so the lens is subtracted here
                via a mask instead of being painted.
    - wordmark: "NORDITA" in Montserrat Medium (nordita.org's brand font), outlined
                to paths so no font has to be available at render time. Cap height
                and position match the official raster logo (136x42) to the pixel.

  Geometry is fixed; only the colour is meant to change. See "Footer logos" in
  docs/architecture.md before touching it.
#}
