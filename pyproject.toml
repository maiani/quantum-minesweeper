[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qminesweeper"
version = "0.4.1"
description = "Quantum Minesweeper Game"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name="Andrea Maiani", email="andrea.maiani@su.se"},
  {name="Niklas Engelhardt Önne", email="niklas.e.onne@fysik.su.se"},
  {name="Jason Pye", email="jason.pye@su.se"}
]
maintainers = [
  {name="Andrea Maiani", email="andrea.maiani@su.se"}
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  "numpy>=1.26,<3",
  "rich>=13,<16",
  "typer>=0.9,<1",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "starlette>=0.40,<2",
  "itsdangerous>=2.1,<3",
  "python-multipart>=0.0.9,<0.1",
  "markdown>=3.5,<4",
  "pymdown-extensions>=10,<12",
  "pydantic-settings>=2.4,<3"
]

[project.optional-dependencies]
stim = ["stim>=1.13,<2"]
qiskit = ["qiskit>=1.2,<3"]
rl = [
  "gymnasium>=0.29,<2",
  "stim>=1.13,<2",
]
dev = [
  "build>=1,<2",
  "setuptools>=68",
  "wheel",
  "pytest>=9,<10",
  "gymnasium>=0.29,<2",
  "stim>=1.13,<2",
  "qiskit>=1.2,<3",
  "ruff>=0.6",
  "pre-commit>=3"
]

[project.urls]
Repository = "https://github.com/maiani/quantum-minesweeper.git"
Changelog = "https://github.com/maiani/quantum-minesweeper/blob/master/CHANGELOG.md"

[project.scripts]
qminesweeper = "qminesweeper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# Two distributions' worth of code in one wheel: the game, and the standalone
# chppy stabilizer library it vendors. chppy is maintained as an independent
# project (see AGENTS.md) and is kept ready to move to its own repository.
[tool.setuptools.packages.find]
where = ["src"]
include = ["qminesweeper*", "chppy*"]

[tool.setuptools.package-data]
qminesweeper = [
  "templates/**/*",
  "static/**/*",
  "docs/**/*"
]

# ---------------- Pytest ----------------

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
  "tests",
]
pythonpath = ["src"]

# ---------------- Ruff ----------------

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["*.ipynb", "*.md", "*.toml", "*.yml", "*.yaml", "*.json"]

# Enable linting + autofix
[tool.ruff.lint]
select = ["E", "F", "I"]  # pyflakes, pycodestyle, and isort rules
fixable = ["ALL"]

# Enable Ruff formatter
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

# ---------------- Pixi development environment ----------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"
nodejs = "22.*"
librsvg = ">=2.58,<3"

[tool.pixi.pypi-dependencies]
qminesweeper = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
lint = { cmd = "python -m ruff check src tests scripts", description = "Run Python lint checks" }
test = { cmd = "pytest", description = "Run the Python test suite" }
js-check = { cmd = "python scripts/check_js.py", description = "Check JavaScript syntax" }
check = { depends-on = ["lint", "test", "js-check"], description = "Run lint, tests, and JavaScript checks" }
package = { cmd = "python -m build --no-isolation --outdir build/packages", description = "Build the wheel and source distribution" }
icons = { cmd = "python scripts/make_icons.py", description = "Regenerate PWA icons" }
browser = { cmd = "python scripts/build_browser.py", description = "Build the browser-only PWA" }
docker-build = { cmd = "bash ./scripts/build.sh", description = "Build the local Docker image" }
docker-run = { cmd = "bash ./scripts/run_local.sh", depends-on = ["docker-build"], description = "Build and run the local Docker image" }
release-check = { depends-on = ["check", "package", "browser"], description = "Run all non-Docker release checks" }
deploy = { cmd = "bash ./scripts/deploy.sh", description = "Build, push, and deploy to Cloud Run" }

[tool.pixi.tasks.browser-serve]
cmd = "python -m http.server -d dist {{ port }}"
depends-on = ["browser"]
args = [{ arg = "port", default = "8000" }]
description = "Build and serve the browser-only PWA"
