name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package + lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -q --disable-warnings

  # Runs the same gate contributors run locally (`pixi run check` = lint + test +
  # js-check). The pip jobs above cover many Python versions but not the pinned
  # pixi toolchain, so this job is what keeps CI and the documented dev workflow
  # from drifting apart. It also provides nodejs from the pixi environment, so
  # `js-check` cannot silently skip for want of a Node interpreter.
  pixi-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # `locked: false` lets pixi re-solve when pixi.lock has fallen behind
          # pyproject.toml instead of failing the job. Dependency bumps (which
          # cannot regenerate the lockfile) therefore stay green and are tested
          # against the dependency they actually request. The trade-off is that
          # lockfile drift is not reported here; flip this to `locked: true` to
          # make CI fail on it, at the cost of a manual `pixi lock` per bump.
          locked: false
          cache: true

      - name: Run the documented development gate
        run: pixi run check

  build-package:
    runs-on: ubuntu-latest
    needs: [lint, test, pixi-check]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test, pixi-check]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t qminesweeper:test \
            .
